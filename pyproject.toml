[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "kreguard"
version = "0.1.0"
description = "Guardrail layer protecting LLM apps from jailbreaks and prompt injection. Text defenses are advisory, permissions are enforcement."
readme = "README.md"
license = { text = "Apache-2.0" }
authors = [{ name = "Kreflux" }]
requires-python = ">=3.9"
dependencies = []
keywords = ["llm", "security", "prompt-injection", "jailbreak", "guardrails"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: Apache Software License",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.9",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Security",
  "Topic :: Software Development :: Libraries",
]

[project.urls]
Homepage = "https://kreflux.com"
Repository = "https://github.com/Kreflux/KreGuard"
Issues = "https://github.com/Kreflux/KreGuard/issues"

[project.scripts]
kreguard = "kreguard.__main__:main"

[tool.setuptools.packages.find]
include = ["kreguard*"]
